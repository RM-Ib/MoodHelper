
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Account - Moodhelper</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="../Images/home/cart3.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;600;700&display=swap" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>


 <nav class="navbar">
    <div class="container">
        <a href="dashboard.html" class="logo">
            <span class="logo-icon">❤️</span>
            <span class="logo-text">MoodHelper</span>
        </a>
        <ul class="nav-links">
            <li><a href="dashboard.html" class="active">Dashboard</a></li>
            <li><a href="diary.html" class="">Diary</a></li>
            <li><a href="daily-prompt.html" class="">Prompts</a></li>
            <li><a href="groups.html" class="">Groups</a></li>
            <li><a href="mood-support.html" class="">Support</a></li>
            <li><a href="settings.html" class="">Settings</a></li>
        </ul>
        <div class="nav-buttons">
            <a href="index.html" class="btn btn-primary">Logout</a>
        </div>
    </div>
</nav>

<main class="main-content">
    <div class="profile-container">
        <i class="bi bi-person-circle profile-icon"></i>
        <h1>My Account</h1>

        <form class="profile-form" id="profileForm">

            <div class="form-group">
                <label for="Fname">First Name</label>
                <input type="text" id="Fname" required autocomplete="given-name">
            </div>

            <div class="form-group">
                <label for="Lname">Last Name</label>
                <input type="text" id="Lname" required autocomplete="family-name">
            </div>


            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" value="john.doe@gmail.com" readonly autocomplete="email">
            </div>

            <button type="button" class="btn btn-secondary"
                onclick="location.href='Change_pass.html'">
                Change Password
            </button>

            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

            <button type="button" class="btn btn-danger" id="logoutBtn">
                Sign Out
            </button>

        </form>
        <div class="badge-section">
    <h2>Your Streak Badges</h2>

    <div class="badges-container">

        <div class="badge-card locked">
            <i class="bi bi-fire"></i>
            <p>7 Day Streak</p>
            <span>Locked</span>
        </div>

        <div class="badge-card locked">
            <i class="bi bi-calendar-check"></i>
            <p>1 Month Streak</p>
            <span>Locked</span>
        </div>

        <div class="badge-card locked">
            <i class="bi bi-award"></i>
            <p>6 Month Streak</p>
            <span>Locked</span>
        </div>

        <div class="badge-card locked">
            <i class="bi bi-trophy"></i>
            <p>1 Year Streak</p>
            <span>Locked</span>
        </div>

    </div>
</div>
    </div>
</main>

<script src="../js/account.js"></script>
</body>
</html>
